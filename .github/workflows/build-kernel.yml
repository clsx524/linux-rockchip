name: Build kernel packages

on:
  push:
    branches: [resolute]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            fakeroot \
            debhelper \
            dpkg-dev \
            libssl-dev \
            libelf-dev \
            bison flex \
            bc cpio rsync kmod \
            dwarves python3-dev

      - name: Build kernel .deb packages
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export $(dpkg-architecture -aarm64)
          export LANG=C

          # Run clean first to create the build directory structure
          fakeroot debian/rules clean do_mainline_build=true

          # The Mali bifrost/valhall drivers use .incbin with paths relative to
          # the source root, but the out-of-tree build runs from the build dir.
          # Symlink the firmware blobs into the build directory so the assembler
          # can find them.
          BUILD_DIR="debian/build/build-rockchip"
          mkdir -p "${BUILD_DIR}"
          for blob in $(find drivers/gpu/arm -name "*.bin" 2>/dev/null); do
            TARGET="${BUILD_DIR}/${blob}"
            mkdir -p "$(dirname "${TARGET}")"
            ln -sf "$(pwd)/${blob}" "${TARGET}"
          done

          # Now build the packages
          fakeroot debian/rules binary-headers binary-rockchip do_mainline_build=true

          # Move debs into a local dir (../*.deb not allowed in upload-artifact)
          mkdir -p debs
          mv ../*.deb debs/

      - name: List produced packages
        run: ls -lh debs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: debs/
          retention-days: 30

      - name: Create GitHub Release with .deb files
        if: github.ref == 'refs/heads/resolute'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(dpkg-parsechangelog -l debian.rockchip/changelog -S Version)
          TAG="kernel-${VERSION//\~/-}"
          gh release create "${TAG}" debs/*.deb \
            --title "Kernel ${VERSION} for resolute" \
            --notes "Automated build from resolute branch" \
            --repo ${{ github.repository }} || true

      - name: Ingest into apt repo
        if: github.ref == 'refs/heads/resolute'
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          VERSION=$(dpkg-parsechangelog -l debian.rockchip/changelog -S Version)
          TAG="kernel-${VERSION//\~/-}"
          for DEB_URL in $(gh release view "${TAG}" \
              --repo ${{ github.repository }} \
              --json assets -q '.assets[].url'); do
            gh workflow run ingest.yml \
              --repo clsx524/ubuntu-rockchip-apt \
              --field deb_url="${DEB_URL}" \
              --field suite=resolute
            sleep 25
          done
